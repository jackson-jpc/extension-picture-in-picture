<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PiP Unlocker</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 560px; margin: 24px auto; padding: 0 16px; line-height: 1.5; }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 1.4em; }
  h1 img { width: 32px; height: 32px; }
  fieldset { border: 1px solid #8884; border-radius: 8px; padding: 12px 16px; margin: 16px 0; }
  label.mode { display: block; margin: 6px 0; cursor: pointer; }
  textarea { width: 100%; min-height: 110px; font-family: ui-monospace, monospace; font-size: 13px; box-sizing: border-box; }
  .hint { opacity: .75; font-size: .9em; }
  button { padding: 8px 18px; border-radius: 6px; border: 1px solid #8886; cursor: pointer; }
  #status { margin-left: 12px; opacity: .8; }
</style>
</head>
<body>
  <h1><img src="icons/icon-64.png" alt=""> PiP Unlocker</h1>

  <fieldset>
    <legend data-i18n="optModeLegend">Onde liberar o Picture-in-Picture</legend>
    <label class="mode"><input type="radio" name="mode" value="all"> <span data-i18n="optModeAll">Em todos os sites (padrão)</span></label>
    <label class="mode"><input type="radio" name="mode" value="list"> <span data-i18n="optModeList">Somente nos sites da lista abaixo</span></label>
    <label class="mode"><input type="radio" name="mode" value="except"> <span data-i18n="optModeExcept">Em todos os sites, exceto os da lista abaixo</span></label>
  </fieldset>

  <fieldset>
    <legend data-i18n="optSitesLegend">Lista de sites</legend>
    <textarea id="sites" spellcheck="false" placeholder="crunchyroll.com"></textarea>
    <p class="hint" data-i18n="optSitesHint">Um domínio por linha. Subdomínios são incluídos automaticamente (crunchyroll.com também vale para static.crunchyroll.com). As páginas já abertas precisam ser recarregadas.</p>
  </fieldset>

  <button id="save" data-i18n="optSave">Salvar</button><span id="status"></span>

  <script src="options.js"></script>
</body>
</html>
